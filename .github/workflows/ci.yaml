name: CI Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, develop,feature/setup-infrastructure ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOTNET_VERSION: '8.0'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          VERSION=$(date +%Y.%m.%d.%H%M%S)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image_tag=ghcr.io/${{ github.repository }}:${VERSION}" >> $GITHUB_OUTPUT
          echo "::notice::Generated version: ${VERSION}"

  build:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run unit tests
        run: |
          dotnet test test/Hyland.Experience.SampleProject.Api.UnitTests \
            -c Release --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            /p:CollectCoverage=true \
            /p:CoverageFormat=opencover \
            /p:CoverageFileName=coverage.opencover.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./test/**/coverage.opencover.xml
          flags: unittests
          name: codecov-umbrella

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: test/**/test-results.trx

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build for analysis
        run: dotnet build -c Release --no-restore

      - name: Run code analysis
        run: |
          dotnet tool install -g roslynator.dotnet.cli --version 1.0.1
          roslynator analyze Hyland.Experience.SampleProject.sln --severity-level info

      - name: Run SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Grype vulnerability scan
        uses: anchore/grype-action@v0
        with:
          path: .
          fail-build: false
          output-format: sarif
          output-file: grype-results.sarif

      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: grype-results.sarif
          category: grype

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  docker-build:
    needs: [build, code-quality, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ needs.setup.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  validate-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Validate Terraform
        working-directory: deployments/terraform
        run: |
          terraform init -backend=false
          terraform validate
          terraform fmt -check -recursive

      - name: TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        working-directory: deployments/terraform
        run: |
          tflint --init
          tflint --recursive

  validate-helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Lint Helm charts
        run: |
          helm lint deployments/helm/sample-api
          helm template deployments/helm/sample-api > /tmp/helm-output.yaml
          cat /tmp/helm-output.yaml

  summary:
    needs: [build, code-quality, security, docker-build, validate-infrastructure, validate-helm]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check pipeline status
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Build failed"
            exit 1
          fi
          echo "✅ All checks passed"
