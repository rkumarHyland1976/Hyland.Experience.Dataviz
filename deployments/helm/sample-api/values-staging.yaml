replicaCount: 3

image:
  tag: "latest"

service:
  type: LoadBalancer

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
  hosts:
    - host: sample-api-staging.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: sample-api-staging-tls
      hosts:
        - sample-api-staging.example.com

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env:
  - name: LOG_LEVEL
    value: "Debug"

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - sample-api
        topologyKey: kubernetes.io/hostname
