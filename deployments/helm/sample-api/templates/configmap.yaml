{{- $envMap := dict }}
{{- range .Values.env }}
{{- $_ := set $envMap .name .value }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sample-api.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sample-api.labels" . | nindent 4 }}
data:
  ASPNETCORE_ENVIRONMENT: "{{ get $envMap "ASPNETCORE_ENVIRONMENT" | default "Production" }}"
  LOG_LEVEL: "{{ get $envMap "LOG_LEVEL" | default "Information" }}"
  API_VERSION: "{{ .Chart.AppVersion }}"
  DEPLOYMENT_DATE: "{{ now | date "2006-01-02T15:04:05Z07:00" }}"
