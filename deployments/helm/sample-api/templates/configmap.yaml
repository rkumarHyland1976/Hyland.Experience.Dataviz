apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sample-api.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sample-api.labels" . | nindent 4 }}
data:
  ASPNETCORE_ENVIRONMENT: "{{ .Values.env | where \"name\" \"ASPNETCORE_ENVIRONMENT\" | first | .value | default \"Production\" }}"
  LOG_LEVEL: "{{ .Values.env | where \"name\" \"LOG_LEVEL\" | first | .value | default \"Information\" }}"
  API_VERSION: "{{ .Chart.AppVersion }}"
  DEPLOYMENT_DATE: "{{ now | date \"2006-01-02T15:04:05Z07:00\" }}"
